[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-workbench"
version = "0.1.0"
description = "LLM workbench API for translation workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ctranslate2",
    "fastapi",
    "transformers",
    "uvicorn",
    "websockets",
    "python-multipart",  # For file uploads
    "pydantic",
]

[tool.setuptools.packages.find]
include = ["app*", "promptlib*"]
exclude = ["tmp*", "deploy*", "sample*", "tests*", "docs*"]

[project.scripts]
llm-workbench = "app.__main__:main"
